name: Gateway Build And Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: gateway-service
  MANIFEST_PATH: gateway
  MANIFEST_REPO: 1-team-whyNot-chapchap/chapchap-manifest

permissions:
  contents: read
  packages: write

# 같은 서비스의 배포가 겹치지 않도록 처리
concurrency:
  group: gateway-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          docker build -t "$IMAGE:$GITHUB_RUN_NUMBER" .
          docker push "$IMAGE:$GITHUB_RUN_NUMBER"

      - name: Checkout manifests
        uses: actions/checkout@v7
        with:
          repository: ${{ env.MANIFEST_REPO }}
          ref: main
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          path: manifest
          fetch-depth: 0

      - name: Update manifest
        working-directory: manifest
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          FILE="${MANIFEST_PATH}/deployment.yaml"

          test -f "$FILE"

          sed -i -E \
            "s#(image:[[:space:]]*)${IMAGE}:[^[:space:]\"']+#\1${IMAGE}:${GITHUB_RUN_NUMBER}#" \
            "$FILE"

          # 이미지 이름이 달라 변경되지 않았으면 중단
          grep -qF "$IMAGE:$GITHUB_RUN_NUMBER" "$FILE"

          git config user.name "GitHub Actions"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Deploy ${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"
          git pull --rebase origin main
          git push origin main
